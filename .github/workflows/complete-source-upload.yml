name: Complete source upload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-source-upload.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand complete source tree
        run: |
          curl --fail --silent --show-error --location https://paste.rs/q6I6N \
            | base64 --decode \
            | gzip --decompress \
            | tar --extract
          rm -f .github/viraldzen-payload.part* .github/workflows/complete-source-upload.yml
      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish complete ViralDzen source tree"
          git push origin main
